name: IndexNow submit

# Notifies IndexNow (Bing, Yandex, et al.) after every production deploy so
# changed/new pages get recrawled promptly instead of waiting on a scheduled
# crawl. Triggered by Vercel's GitHub integration posting a `deployment_status`
# event once the Production deploy actually finishes building — NOT on push,
# so we never submit URLs before the new build is live.
#
# Required repo secrets:
#   CRON_SECRET   — bearer token accepted by /api/tasks/indexnow
#                    (set the same value in Vercel env vars)
#   SITE_URL      — optional; defaults to https://eclipsechase.is

# RETIRED 2026-08-13 — the archive's content is frozen, so there are no
# updates to notify search engines about.
on:
  workflow_dispatch:

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit URLs to IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://eclipsechase.is' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi

          response=$(curl -sS -L \
            -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/tasks/indexnow/")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $http_code"
          echo "$body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::IndexNow endpoint returned $http_code"
            exit 1
          fi
